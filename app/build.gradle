plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv("GUIBYD_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("GUIBYD_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("GUIBYD_KEY_ALIAS")
def releaseKeyPassword = System.getenv("GUIBYD_KEY_PASSWORD")
def supabaseUrl = System.getenv("SUPABASE_URL") ?: ""
def supabaseKey = System.getenv("SUPABASE_ANON_KEY") ?: ""
def quoted = { value -> "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\"" }

android {
    namespace 'com.guibyd.apps'
    compileSdk 35

    defaultConfig {
        applicationId "com.guibyd.apps"
        minSdk 23
        targetSdk 28
        versionCode 6
        versionName "3.3"
        buildConfigField "String", "SUPABASE_URL", quoted(supabaseUrl)
        buildConfigField "String", "SUPABASE_KEY", quoted(supabaseKey)
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (releaseStorePath) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            minifyEnabled false
            shrinkResources false

            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
}
